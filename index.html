<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrivateLedger | Restored Settle & Due Dates</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Geist', sans-serif; background-color: #fcfcfc; color: #111827; padding-bottom: 120px; }
        
        #privacyShield { transition: opacity 0.4s ease; display: none; }
        .app-content { filter: blur(25px); pointer-events: none; transition: filter 0.5s ease; }
        .app-unlocked { filter: blur(0); pointer-events: auto; }

        .card-base { background: white; border-radius: 28px; padding: 24px; border: 1px solid #f3f4f6; }
        .report-card { background: #f9faff; border: 1px solid #eef2ff; }
        
        #activityLog { height: 450px; overflow-y: auto; scrollbar-width: none; }
        #activityLog::-webkit-scrollbar { display: none; }

        .search-bar { background: #f3f6f9; border-radius: 18px; padding: 18px 20px 18px 52px !important; width: 100%; border: none; outline: none; }
        
        .badge-pill { font-size: 9px; font-weight: 700; padding: 6px 12px; border-radius: 10px; text-transform: uppercase; }
        .badge-expense { background: #f3f4f6; color: #9ca3af; }
        .badge-borrowed { background: #fff1f2; color: #e11d48; }
        .badge-lent { background: #eef2ff; color: #4f46e5; }
        .badge-income { background: #f0fdf4; color: #16a34a; }
        .badge-overdue { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; }

        .action-btn { font-size: 9px; font-weight: 700; padding: 6px 12px; border-radius: 10px; background: #fff1f2; color: #e11d48; margin-left: 8px; border: none; }
        .action-btn-green { background: #f0fdf4; color: #16a34a; }

        .currency-btn { padding: 4px 12px; border-radius: 10px; font-size: 10px; font-weight: 800; border: 1px solid #f3f4f6; color: #9ca3af; }
        .currency-active { background: #6366f1; color: white; border-color: #6366f1; }
        
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 100px; background: white; border-top: 1px solid #f3f4f6; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <!-- Privacy Shield -->
    <div id="privacyShield" class="fixed inset-0 bg-white/90 backdrop-blur-xl z-[5000] flex flex-col items-center justify-center p-8">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-6"><i class="ri-lock-2-fill text-3xl"></i></div>
        <h2 id="shieldTitle" class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400 mb-8">Secure Access Required</h2>
        <input type="password" id="entryPin" placeholder="••••" class="text-center text-4xl tracking-[0.4em] border-none bg-transparent w-full mb-8 outline-none">
        <button onclick="handlePinSubmit()" class="w-full max-w-xs bg-zinc-900 text-white py-5 rounded-2xl text-[11px] font-bold uppercase">Verify PIN</button>
        <button id="cancelShield" onclick="hideShield()" class="mt-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest hidden">Cancel</button>
    </div>

    <div id="appContainer" class="app-content">
        <header class="p-8 pb-4 flex justify-between items-start bg-white">
            <div>
                <p class="text-[10px] font-bold text-indigo-500 uppercase tracking-[0.2em] mb-1">Personal Finance</p>
                <h1 class="text-3xl font-light tracking-tight text-zinc-900">Private<span class="font-bold">Ledger</span></h1>
            </div>
            <div class="text-right">
                <div class="flex bg-zinc-50 p-1 rounded-xl gap-1 mb-2 scale-90 origin-right">
                    <button id="btnQAR" onclick="setCurrency('QAR')" class="currency-btn currency-active">QAR</button>
                    <button id="btnPKR" onclick="setCurrency('PKR')" class="currency-btn">PKR</button>
                </div>
                <p id="totalBalance" class="text-2xl font-bold tracking-tighter text-zinc-900">0</p>
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Net Position</p>
            </div>
        </header>

        <main class="max-w-xl mx-auto p-6 space-y-6">
            <div class="card-base report-card">
                <div class="flex justify-between items-center mb-8">
                    <h3 id="reportMonth" class="text-[11px] font-bold uppercase tracking-widest text-indigo-600">MAY 2026</h3>
                    <i class="ri-time-line text-indigo-300 text-xl"></i>
                </div>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div><p class="text-[9px] uppercase text-gray-400 font-bold mb-2">Earned</p><p id="monthEarned" class="text-lg font-bold text-green-500">0</p></div>
                    <div class="border-x border-indigo-100"><p class="text-[9px] uppercase text-gray-400 font-bold mb-2">Spent</p><p id="monthSpent" class="text-lg font-bold text-red-500">0</p></div>
                    <div><p class="text-[9px] uppercase text-gray-400 font-bold mb-2">Savings</p><p id="monthSavings" class="text-lg font-bold text-indigo-600">0</p></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="card-base !bg-indigo-600 text-white shadow-xl">
                    <p class="text-[10px] font-bold uppercase opacity-80 tracking-widest">To Collect</p>
                    <h2 id="toCollect" class="text-2xl font-bold mt-2">0</h2>
                </div>
                <div class="card-base !bg-zinc-900 text-white shadow-xl">
                    <p class="text-[10px] font-bold uppercase opacity-80 tracking-widest">To Return</p>
                    <h2 id="toReturn" class="text-2xl font-bold mt-2">0</h2>
                </div>
            </div>

            <div class="card-base border-dashed border-2 bg-transparent">
                <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-indigo-500 mb-4">Category Breakdown</h3>
                <div id="categoryBreakdown" class="grid grid-cols-2 gap-y-3 gap-x-6"></div>
            </div>

            <div class="relative">
                <i class="ri-search-line absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-xl"></i>
                <input type="text" id="searchInput" oninput="renderRecords(localRecords)" placeholder="Search people, items, or dates..." class="search-bar">
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center px-2">
                    <h3 class="text-[11px] font-bold uppercase tracking-widest text-gray-400">Activity Log</h3>
                    <button onclick="requestWipe()" class="text-[8px] font-bold uppercase text-red-500 bg-red-50 px-3 py-1 rounded-full border border-red-100">Wipe All</button>
                </div>
                <div id="activityLog" class="space-y-4 pb-10"></div>
            </div>
        </main>

        <nav>
            <button onclick="openModal('Lent')" class="flex flex-col items-center gap-1 text-zinc-400"><i class="ri-group-line text-2xl"></i><span class="text-[10px] font-bold uppercase">Lent</span></button>
            <button onclick="openModal('General')" class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center shadow-2xl -translate-y-6 active:scale-90 transition-all"><i class="ri-add-line text-4xl"></i></button>
            <button onclick="openModal('Borrowed')" class="flex flex-col items-center gap-1 text-zinc-400"><i class="ri-hand-coin-line text-2xl"></i><span class="text-[10px] font-bold uppercase">Borrowed</span></button>
        </nav>
    </div>

    <div id="entryModal" class="fixed inset-0 hidden items-center justify-center z-[2000] p-6">
        <div class="absolute inset-0 bg-zinc-950/40 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative w-full max-w-md bg-white rounded-[35px] p-8 shadow-2xl">
            <h2 id="modalTitle" class="text-center text-[10px] font-bold uppercase mb-8 tracking-[0.3em]">New Entry</h2>
            <div id="generalTypeToggle" class="hidden grid grid-cols-2 gap-2 mb-6">
                <button onclick="setSubType('Expense')" id="btnExp" class="py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-indigo-600 text-indigo-600">Spend</button>
                <button onclick="setSubType('Income')" id="btnInc" class="py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-transparent bg-zinc-50 text-zinc-400">Earn</button>
            </div>
            <div class="space-y-2">
                <input id="eDesc" type="text" placeholder="Description" class="bg-zinc-50 border-none p-4 rounded-2xl w-full outline-none">
                <input id="eAmount" type="number" placeholder="0.00" class="bg-zinc-50 border-none p-4 rounded-2xl text-xl font-bold w-full outline-none">
                <div id="generalOptions" class="hidden">
                    <select id="eCategory" class="bg-zinc-50 border-none p-4 rounded-2xl w-full outline-none">
                        <option value="Other">Category</option>
                        <option value="Food">Food</option><option value="Medicine">Medicine</option><option value="Education">Education</option><option value="Travel">Travel</option><option value="Leisure">Leisure</option><option value="Bills">Bills</option><option value="Telecom">Telecom</option>
                    </select>
                </div>
                <div id="debtOptions" class="hidden space-y-2">
                    <input id="ePerson" type="text" placeholder="Person's Name" class="bg-zinc-50 border-none p-4 rounded-2xl w-full outline-none">
                    <div class="bg-zinc-50 p-4 rounded-2xl">
                        <p class="text-[9px] font-bold text-gray-400 uppercase mb-2">Promise Date (Optional)</p>
                        <input id="eDueDate" type="date" class="bg-transparent border-none w-full outline-none text-zinc-600">
                    </div>
                </div>
                <button onclick="saveEntry()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl text-[11px] font-bold uppercase mt-6">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://lhtqxqszhwrjhjwfldns.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxodHF4cXN6aHdyamhqd2ZsZG5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTI2MTEsImV4cCI6MjA5MzIyODYxMX0.-u0C3vI4ib5TOrTbblsCXeunf_gvWPTXHVHb3QxYWfc';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let localRecords = [];
        let currentCurrency = 'QAR';
        let currentMainType = '';
        let currentSubType = 'Expense';
        let pendingAction = null;
        let pendingId = null;

        window.onload = () => { showShield("Secure Access Required", false); };

        function showShield(title, showCancel) {
            document.getElementById('shieldTitle').innerText = title;
            document.getElementById('cancelShield').style.display = showCancel ? 'block' : 'none';
            document.getElementById('privacyShield').style.display = 'flex';
            document.getElementById('entryPin').focus();
        }

        function hideShield() {
            document.getElementById('privacyShield').style.display = 'none';
            document.getElementById('entryPin').value = '';
            pendingAction = null;
            pendingId = null;
        }

        async function handlePinSubmit() {
            const entered = document.getElementById('entryPin').value;
            const { data } = await _supabase.from('secret_auth').select('pin_code').eq('pin_code', entered).single();
            if (data) {
                if (!pendingAction) {
                    document.getElementById('appContainer').classList.add('app-unlocked');
                    fetchRecords();
                    hideShield();
                } else if (pendingAction === 'WIPE') {
                    await _supabase.from('personal_expenses').delete().eq('currency', currentCurrency);
                    fetchRecords(); hideShield();
                } else if (pendingAction === 'DELETE') {
                    await _supabase.from('personal_expenses').delete().eq('id', pendingId);
                    fetchRecords(); hideShield();
                }
            } else { alert("Invalid PIN"); document.getElementById('entryPin').value = ''; }
        }

        function requestWipe() { pendingAction = 'WIPE'; showShield("PIN required to Wipe All", true); }
        function requestDelete(id) { pendingAction = 'DELETE'; pendingId = id; showShield("PIN required to delete", true); }

        async function fetchRecords() {
            const { data } = await _supabase.from('personal_expenses').select('*').order('created_at', { ascending: false });
            if (data) { localRecords = data; renderRecords(localRecords); }
        }

        function setCurrency(c) {
            currentCurrency = c;
            document.getElementById('btnQAR').classList.toggle('currency-active', c === 'QAR');
            document.getElementById('btnPKR').classList.toggle('currency-active', c === 'PKR');
            renderRecords(localRecords);
        }

        function formatDateTime(iso) {
            const d = new Date(iso);
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            return `${days[d.getDay()]} ${d.getDate().toString().padStart(2, '0')} ${months[d.getMonth()]} • ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        }

        function renderRecords(records) {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = records.filter(r => r.currency === currentCurrency && (r.description.toLowerCase().includes(search) || (r.person && r.person.toLowerCase().includes(search))));
            
            let logHTML = ''; let net = 0, mEarn = 0, mSpent = 0;
            const cats = { Food: 0, Medicine: 0, Education: 0, Telecom: 0, Bills: 0, Travel: 0, Leisure: 0, Other: 0 };
            const peopleDebt = {}; 
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            
            filtered.forEach(r => {
                let pKey = r.person || (r.description.startsWith('Settle:') ? r.description.split(': ')[1] : null);
                if (pKey) {
                    if (!peopleDebt[pKey]) peopleDebt[pKey] = 0;
                    if (r.type === 'Lent') peopleDebt[pKey] += r.amount;
                    if (r.type === 'Borrowed') peopleDebt[pKey] -= r.amount;
                    if (r.type === 'Expense' && r.description.startsWith('Settle:')) peopleDebt[pKey] += r.amount;
                    if (r.type === 'Income' && r.description.startsWith('Settle:')) peopleDebt[pKey] -= r.amount;
                }
            });

            filtered.forEach(r => {
                const isThisMonth = new Date(r.created_at).getMonth() === now.getMonth() && new Date(r.created_at).getFullYear() === now.getFullYear();
                if (r.type === 'Income' || r.type === 'Borrowed') net += r.amount; else net -= r.amount;
                if (isThisMonth) { if (r.type === 'Income') mEarn += r.amount; if (r.type === 'Expense') mSpent += r.amount; }
                if (r.type === 'Expense') cats[r.category || 'Other'] += r.amount;

                let badge = `badge-${r.type.toLowerCase()}`;
                let label = r.type + (r.person ? ` (${r.person})` : '');
                let action = '';
                
                // Overdue Check
                let overdueBadge = '';
                if (r.due_date && r.due_date < todayStr && !r.description.startsWith('Settle:')) {
                    overdueBadge = `<span class="badge-pill badge-overdue ml-2">Overdue: ${r.due_date}</span>`;
                } else if (r.due_date) {
                    overdueBadge = `<span class="badge-pill bg-zinc-50 text-zinc-400 border border-zinc-100 ml-2">Due: ${r.due_date}</span>`;
                }

                if (r.type === 'Borrowed' && r.person && peopleDebt[r.person] < 0) {
                    action = `<button onclick="settle('${r.person}', ${r.amount}, 'Expense')" class="action-btn">Pay Back</button>`;
                } else if (r.type === 'Lent' && r.person && peopleDebt[r.person] > 0) {
                    action = `<button onclick="settle('${r.person}', ${r.amount}, 'Income')" class="action-btn action-btn-green">Received</button>`;
                }

                logHTML += `
                    <div class="card-base !p-6 flex justify-between items-center shadow-sm mb-4">
                        <div>
                            <p class="text-base font-bold">${r.description}</p>
                            <p class="text-[10px] text-zinc-300 font-bold uppercase mt-1">${formatDateTime(r.created_at)}</p>
                            <div class="mt-3 flex items-center"><span class="badge-pill ${badge}">${label}</span>${overdueBadge}${action}</div>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <p class="text-lg font-bold">${r.amount.toLocaleString()}</p>
                            <button onclick="requestDelete(${r.id})" class="text-zinc-200"><i class="ri-delete-bin-line text-lg"></i></button>
                        </div>
                    </div>`;
            });

            let col = 0, ret = 0;
            Object.values(peopleDebt).forEach(v => { if (v > 0) col += v; if (v < 0) ret += Math.abs(v); });
            document.getElementById('activityLog').innerHTML = logHTML || '<p class="text-center text-gray-400 py-10">Empty Ledger</p>';
            document.getElementById('toCollect').innerText = col.toLocaleString();
            document.getElementById('toReturn').innerText = ret.toLocaleString();
            document.getElementById('totalBalance').innerText = (net < 0 ? '-' : '') + Math.abs(net).toLocaleString();
            document.getElementById('monthEarned').innerText = mEarn.toLocaleString();
            document.getElementById('monthSpent').innerText = mSpent.toLocaleString();
            document.getElementById('monthSavings').innerText = (mEarn - mSpent).toLocaleString();

            let cHTML = '';
            for (let [n, v] of Object.entries(cats)) if (v > 0) cHTML += `<div class="text-[12px] flex justify-between w-full"><span class="text-gray-400">${n}:</span><b class="text-zinc-800">${v.toLocaleString()}</b></div>`;
            document.getElementById('categoryBreakdown').innerHTML = cHTML || '<p class="text-gray-300 text-[10px]">No expenses.</p>';
        }

        async function settle(p, a, t) {
            if(confirm(`Settle ${p}?`)) {
                await _supabase.from('personal_expenses').insert([{ description: `Settle: ${p}`, amount: a, type: t, currency: currentCurrency, category: 'Other' }]);
                fetchRecords();
            }
        }

        async function saveEntry() {
            const d = document.getElementById('eDesc').value; const a = parseFloat(document.getElementById('eAmount').value);
            const t = currentMainType === 'General' ? currentSubType : currentMainType;
            if(!d || !a) return;
            
            const entry = { 
                description: d, amount: a, type: t, currency: currentCurrency, 
                person: (t === 'Income' || t === 'Expense') ? null : document.getElementById('ePerson').value, 
                category: document.getElementById('eCategory').value 
            };
            
            // Add due date if it's a debt entry
            if (t === 'Lent' || t === 'Borrowed') {
                const dueDate = document.getElementById('eDueDate').value;
                if (dueDate) entry.due_date = dueDate;
            }

            await _supabase.from('personal_expenses').insert([entry]);
            fetchRecords(); closeModal();
        }

        function openModal(t) { 
            currentMainType = t; 
            currentSubType = 'Expense';
            document.getElementById('btnExp').className = 'py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-indigo-600 text-indigo-600';
            document.getElementById('btnInc').className = 'py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-transparent bg-zinc-50 text-zinc-400';
            document.getElementById('debtOptions').className = t === 'General' ? 'hidden' : 'block';
            document.getElementById('generalOptions').className = t === 'General' ? 'block' : 'hidden';
            document.getElementById('generalTypeToggle').style.display = t === 'General' ? 'grid' : 'none';
            document.getElementById('entryModal').style.display = 'flex';
            // Reset inputs
            document.getElementById('eDesc').value = '';
            document.getElementById('eAmount').value = '';
            document.getElementById('ePerson').value = '';
            document.getElementById('eDueDate').value = '';
        }
        function closeModal() { document.getElementById('entryModal').style.display = 'none'; }
        
        function setSubType(s) { 
            currentSubType = s; 
            const isExp = s === 'Expense';
            document.getElementById('btnExp').className = isExp ? 'py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-indigo-600 text-indigo-600' : 'py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-transparent bg-zinc-50 text-zinc-400';
            document.getElementById('btnInc').className = !isExp ? 'py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-green-600 text-green-600' : 'py-3 text-[10px] font-bold uppercase rounded-xl border-2 border-transparent bg-zinc-50 text-zinc-400';
        }
    </script>
</body>
</html>
